[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "piko"
version = "0.2.0"
description = "개인용 윈도우 데스크탑 마스코트"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.12"]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8", "pyinstaller>=6.16"]

[tool.setuptools.packages.find]
include = ["piko*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["piko.spec"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: 이름 규칙, UP: 최신 문법, B: 버그 패턴, ANN: 타입 힌트
select = ["E", "W", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]  # Any 사용은 허용(설정 값 등)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 기능 폴더마다 같은 이름의 테스트 파일(test_settings.py 등)을 둘 수 있게 경로 기준으로 불러온다
addopts = "--import-mode=importlib"
